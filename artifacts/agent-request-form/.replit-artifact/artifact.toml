kind = "web"
previewPath = "/form/"
title = "منصة متابعة عمليات المراكز والوكلاء"
version = "1.0.0"
id = "artifacts/agent-request-form"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/form/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/agent-request-form run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agent-request-form", "run", "build" ]
publicDir = "artifacts/agent-request-form/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/form/"
