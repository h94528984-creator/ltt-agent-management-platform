kind = "web"
previewPath = "/"
title = "LTT Sales Platform"
version = "1.0.0"
id = "artifacts/ltt-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20147

[services.development]
run = "pnpm --filter @workspace/ltt-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ltt-platform", "run", "build" ]
publicDir = "artifacts/ltt-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20147"
BASE_PATH = "/"
