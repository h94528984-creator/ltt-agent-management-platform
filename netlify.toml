# =========================================================
#  LTT Agent Management Platform - Netlify Configuration
# =========================================================

[build]
  command = "pnpm run build:netlify"
  publish = "artifacts/ltt-platform/dist"

[build.environment]
  NODE_VERSION = "20"
  # Allow pnpm to update lockfile if config changed
  PNPM_FLAGS = "--no-frozen-lockfile"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = []

# ---- Package Manager Flags ----
[build.processing]
  skip_processing = false

# ---- API Redirect: ALL /api/* → single router function ----
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# ---- SPA Fallback: all non-API, non-file routes → index.html ----
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---- Security Headers ----
[[headers]]
  for = "/*"
  values = { X-Content-Type-Options = "nosniff", X-Frame-Options = "DENY", X-XSS-Protection = "1; mode=block", Referrer-Policy = "strict-origin-when-cross-origin" }

[[headers]]
  for = "/assets/*"
  values = { Cache-Control = "public, max-age=31536000, immutable" }

[[headers]]
  for = "/*.js"
  values = { Cache-Control = "public, max-age=31536000, immutable" }

[[headers]]
  for = "/*.css"
  values = { Cache-Control = "public, max-age=31536000, immutable" }

[[headers]]
  for = "/*.svg"
  values = { Cache-Control = "public, max-age=31536000, immutable" }

[[headers]]
  for = "/*.png"
  values = { Cache-Control = "public, max-age=31536000, immutable" }

[[headers]]
  for = "/*.jpg"
  values = { Cache-Control = "public, max-age=31536000, immutable" }

[[headers]]
  for = "/*.webp"
  values = { Cache-Control = "public, max-age=31536000, immutable" }

[[headers]]
  for = "/*.woff2"
  values = { Cache-Control = "public, max-age=31536000, immutable" }
